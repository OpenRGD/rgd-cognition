name: Temporary source snapshot for RI-COG-01 authoring
on:
  push:
    branches:
      - feat/cog-ri-01-observation-ref-adapter
permissions:
  contents: read
jobs:
  snapshot-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: cog
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-reality-ingress
          ref: 5372f758df79c93fc887f3858d878635447f4a4d
          persist-credentials: false
          path: ri
      - name: Export reviewed public code only (not a conformance test)
        run: |
          tar -czf cog-snapshot.tgz -C cog --exclude=.git --exclude=.upstream .
          tar -czf ri-snapshot.tgz -C ri --exclude=.git .
          sha256sum cog-snapshot.tgz ri-snapshot.tgz > INPUT_SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ri-cog-01-reviewed-inputs
          path: |
            cog-snapshot.tgz
            ri-snapshot.tgz
            INPUT_SHA256SUMS
          retention-days: 1
