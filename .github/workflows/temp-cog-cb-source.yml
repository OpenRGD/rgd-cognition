name: Temporary source export for COG-CB review closure
on:
  push:
    branches:
      - feat/cog-core-b-adapter-conformance
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Export only reviewed PR6 source files (not a validation)
        run: |
          tar -czf /tmp/cog-core-b-pr6-source.tar.gz \
            src/rgd_cognition/core_b_adapter.py \
            src/rgd_cognition/core_b_c1.py \
            src/rgd_cognition/core_b_demo.py \
            src/rgd_cognition/schemas/core-b-local.schema.json \
            docs/COG-CORE-B.md \
            tests_core_b/test_core_b_adapter.py \
            tests_core_b/test_core_b_c1.py \
            tools/check_core_b_scope.py \
            .github/workflows/core-b-adapter.yml
          cp /tmp/cog-core-b-pr6-source.tar.gz source-review.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-pr6-source-only
          path: source-review.tar.gz
          retention-days: 1
