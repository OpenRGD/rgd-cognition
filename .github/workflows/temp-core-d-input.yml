name: Temporary exact source snapshot for CORE-D consumer review
on:
  push:
    branches:
      - feat/cog-core-d-oneiric-memory-boundary
permissions:
  contents: read
jobs:
  snapshot-only:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          path: cog
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: 7b15fda5c825f9359ce0045377ec38364de19efb
          persist-credentials: false
          path: core-d
      - name: Export exact reviewed source inputs (no validation)
        run: |
          tar -czf cog-source.tar.gz -C cog --exclude=.git .
          tar -czf core-d-contracts.tar.gz -C core-d contracts/temporal-memory/v0.1.0
          sha256sum cog-source.tar.gz core-d-contracts.tar.gz > INPUT_SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cog-core-d-reviewed-inputs
          path: |
            cog-source.tar.gz
            core-d-contracts.tar.gz
            INPUT_SHA256SUMS
          retention-days: 1
