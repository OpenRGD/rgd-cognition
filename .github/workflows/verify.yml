name: Cognition foundation checks
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cognition-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    name: foundation-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependency set
        run: python -m pip install -r requirements-ci.txt
      - name: Install candidate package
        run: python -m pip install --no-build-isolation --no-deps -e .
      - name: Contracts, runtime and adversarial tests
        run: python -m unittest discover -s tests -v
      - name: Synthetic replay
        run: python -m rgd_cognition demo --events 1000
      - name: Build wheel
        run: python -m pip wheel --no-build-isolation --no-deps . -w dist
      - name: Verify installed wheel includes schemas and CLI
        run: |
          python -m venv /tmp/cog-wheel-check
          /tmp/cog-wheel-check/bin/python -m pip install -r requirements-ci.txt
          /tmp/cog-wheel-check/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/cog-wheel-check/bin/python -m rgd_cognition demo --events 10
      - name: Whitespace check
        run: git diff --check
