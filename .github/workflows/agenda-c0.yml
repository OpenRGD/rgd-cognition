name: COG-C0 autonomous agenda lab
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agenda-c0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agenda-lab:
    name: agenda-c0-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # existing reviewed pin; refresh in separate maintenance PR
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Install reviewed dependency set and package
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e .
      - name: C0 schema and deterministic adversarial tests
        run: python -m unittest discover -s tests -p test_agenda_c0.py -v
      - name: Synthetic agenda and two-step Oneiric replay
        run: python -m rgd_cognition.agenda_c0_demo --events 12
      - name: Installed wheel smoke outside source tree
        run: |
          python -m pip wheel --no-build-isolation --no-deps . -w dist
          python -m venv /tmp/cog-c0-wheel
          /tmp/cog-c0-wheel/bin/python -m pip install -r requirements-ci.txt
          /tmp/cog-c0-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/cog-c0-wheel/bin/python -m rgd_cognition.agenda_c0_demo --events 6
