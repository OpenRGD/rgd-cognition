name: RGD context conformance
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rgd-context-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integration:
    name: rgd-context-py${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2; refresh separately
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/openrgd
          ref: afe1a831b950a4e6560f0285a0103fc4eaa343b7
          path: .upstream/core
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - name: Verify pinned Core checkout and install dependencies
        run: |
          test "$(git -C .upstream/core rev-parse HEAD)" = afe1a831b950a4e6560f0285a0103fc4eaa343b7
          python -m pip install -r requirements-ci.txt -r requirements-rgd-ci.txt
          python -m pip install --no-build-isolation --no-deps -e .upstream/core -e .
          python -m pip check
      - name: Foundation and context unit regression
        run: python -m unittest discover -s tests -v
      - name: Real producer-consumer conformance, not mocks
        env:
          RGD_CORE_CHECKOUT: ${{ github.workspace }}/.upstream/core
        run: python -m unittest discover -s tests_integration -v
      - name: Synthetic replay and packaged context consumer
        run: |
          python -m rgd_cognition demo --events 1000
          python -m pip wheel --no-build-isolation --no-deps . -w dist
          python -m venv /tmp/cog02-wheel
          /tmp/cog02-wheel/bin/python -m pip install -r requirements-ci.txt -r requirements-rgd-ci.txt
          /tmp/cog02-wheel/bin/python -m pip install --no-build-isolation --no-deps .upstream/core dist/*.whl
          export CORE="$GITHUB_WORKSPACE/.upstream/core"
          cd /tmp
          /tmp/cog02-wheel/bin/python -m rgd_cognition.rgd_context --profile-root "$CORE" --alias lab-robot --expected-source-root sha256:c049dc3fb91c19e668ef0d35b9b40d9052caf1a458b1a108d58b1896189dd5f9
