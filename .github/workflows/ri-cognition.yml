name: COG RI-01 read-only observation reference conformance
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cog-ri-${{ github.ref }}
  cancel-in-progress: true
jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    name: cog-ri-py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12']
    env:
      RI_CHECKOUT: ${{ github.workspace }}/.upstream/ri
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: OpenRGD/rgd-reality-ingress
          ref: 5372f758df79c93fc887f3858d878635447f4a4d
          path: .upstream/ri
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Verify independent RI revision and install packages
        run: |
          test "$(git -C .upstream/ri rev-parse HEAD)" = 5372f758df79c93fc887f3858d878635447f4a4d
          python -m pip install -r requirements-ci.txt
          python -m pip install --no-build-isolation --no-deps -e . .upstream/ri
          python -m pip check
      - name: Genuine RI PR4 evidence producer to COG ref-only consumer
        run: |
          python -m unittest discover -s tests_ri -v
          python -O -m unittest discover -s tests_ri -v
      - name: Unmodified RI v0.4/PR4 tests and COG foundation regressions
        run: |
          python -m unittest discover -s .upstream/ri/tests -v
          python -m unittest discover -s tests -v
      - name: Strict additive scope, unchanged pre-existing COG runtime
        run: |
          git fetch --no-tags --depth=1 origin 3b78e835ca963ea80ee20885d3552e5f200c2b99
          git fetch --no-tags --depth=1 origin a8ae925c9cacbce8bd7a6db01833d4159445d47a
          python tools/check_ri_scope.py
          python tools/check_core_b_scope.py
          python tools/check_core_d_scope.py
          git diff --check 3b78e835ca963ea80ee20885d3552e5f200c2b99 HEAD
      - name: Packaged wheel can validate an RI contract outside checkout
        run: |
          python -m pip wheel --no-build-isolation --no-deps . -w dist
          python -m venv /tmp/ri-cog-wheel
          /tmp/ri-cog-wheel/bin/python -m pip install -r requirements-ci.txt
          /tmp/ri-cog-wheel/bin/python -m pip install --no-deps dist/*.whl
          cd /tmp
          /tmp/ri-cog-wheel/bin/python -c "from rgd_cognition.ri_observation_ref import RIReferenceContract; from pathlib import Path; import os; p=Path(os.environ['RI_CHECKOUT'])/'contracts/consumer-observation-ref.v0.1-candidate.schema.json'; RIReferenceContract(p.read_bytes()); print('RI COG wheel schema check PASS')"
